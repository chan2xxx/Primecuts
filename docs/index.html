<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrimeCuts POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    HOW TO USE:
    1. Deploy the Apps Script project as a Web App (Deploy > New deployment > Web app).
    2. Copy the "Web app URL" it gives you.
    3. Paste it below, replacing PASTE_DEPLOYED_URL_HERE (keep the quotes).
    4. Commit + push. If GitHub Pages is enabled for this /docs folder,
       your GitHub Pages link will always forward to the live POS.
  -->
  <script>
    var DEPLOYED_URL = "https://script.google.com/macros/s/AKfycbzbUZvtOC5XVKl_hMSnmtULxPIIVmRDyeuVObPUOVOIQLxmh3jv4r1MsVrHV3JVrhqu/exec";
    if (DEPLOYED_URL.indexOf("http") === 0) {
      window.location.replace(DEPLOYED_URL);
    }
  </script>

  <style>
    body { font-family: Arial, Helvetica, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; color: #222; text-align: center; }
    .box { max-width: 420px; padding: 24px; }
    a.btn { display: inline-block; margin-top: 16px; background: #b3261e; color: #fff; padding: 10px 20px; border-radius: 6px; text-decoration: none; }
    code { background: #eee; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>PrimeCuts POS</h2>
    <p id="msg">Redirecting to the POS system...</p>
    <p>If it doesn't redirect automatically, the deployed URL hasn't been set yet in <code>docs/index.html</code>, or click below:</p>
    <a class="btn" id="fallbackLink" href="#">Open POS</a>
  </div>

  <script>
    var link = document.getElementById('fallbackLink');
    if (DEPLOYED_URL.indexOf("http") === 0) {
      link.href = DEPLOYED_URL;
    } else {
      document.getElementById('msg').textContent = "Deployed URL not set yet.";
      link.style.display = 'none';
    }
  </script>
</body>
</html>
